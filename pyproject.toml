[project]
name = "ai-support-assistant"
version = "0.1.0"
description = "Customer-support assistant that answers from your own documentation, with human handoff."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "The ai-support-assistant authors" }]
keywords = ["support", "rag", "claude", "telegram", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.0",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "python-telegram-bot>=21.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]

[project.urls]
Homepage = "https://github.com/ldiazcuadrado/ai-support-assistant"
Repository = "https://github.com/ldiazcuadrado/ai-support-assistant"
Issues = "https://github.com/ldiazcuadrado/ai-support-assistant/issues"

[project.scripts]
support-assistant = "support_assistant.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "ASYNC", "S", "N", "PL", "TID", "T20"]
ignore = ["PLR2004", "PLR0913", "S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR0915", "T20", "PT012", "PT018", "PLC0415"]
"src/support_assistant/cli.py" = ["T20", "PLC0415"]
"src/support_assistant/retrieval/embeddings.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=support_assistant --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["support_assistant"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover", "\\.\\.\\."]
omit = ["src/support_assistant/__main__.py"]
